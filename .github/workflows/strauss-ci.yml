name: Strauss CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-regression:
    name: Dependency-light repository regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dependency-free shipped regressions
        run: >-
          node --test
          tests/frontend/format.test.mjs
          tests/frontend/bootstrap-splash-hook-order.test.mjs
